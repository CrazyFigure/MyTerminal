name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 发布说明需要读取完整 tag 历史，用当前 tag 对比上一个 tag 生成本次变更。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate release notes
        id: release_notes
        shell: pwsh
        run: |
          # 发布说明只统计当前 tag 相对上一个可达 tag 的提交；解析规则见 scripts/generate-release-notes.ps1
          # 与 AGENTS.md「发版规范」，发版提交会读取正文条目，避免更新弹窗显示“本次暂无”。
          $body = & ./scripts/generate-release-notes.ps1 -Ref HEAD
          $body = ($body -join [Environment]::NewLine).TrimEnd()
          'body<<__MYTERMINAL_RELEASE_BODY__' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          '__MYTERMINAL_RELEASE_BODY__' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # 使用 tauri-action 当前公开主版本 v0；上游没有 v1 tag，错误版本会在任务初始化阶段直接失败。
      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MyTerminal ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 使用 action.yml 支持的资产命名参数，让 Release 附件名称稳定可识别。
          assetNamePattern: MyTerminal_[version]_[platform]_[arch][setup][ext]
