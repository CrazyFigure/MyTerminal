<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="git-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- 整体居中并旋转 45 度形成标准 Git 菱形 -->
  <g transform="translate(24, 24) rotate(45)" filter="url(#git-shadow)">
    <!-- 菱形外围剪裁/微圆角背景容器（32x32 区域，圆角 5px） -->
    <rect x="-16" y="-16" width="32" height="32" rx="5" fill="#1b1f23" />

    <!-- 四色象限色块 (各 15.2x15.2，保留极细深色接缝) -->
    <!-- 左上象限：珊瑚粉红 -->
    <path d="M -15.5 -15.5 L -0.5 -15.5 L -0.5 -0.5 L -15.5 -0.5 Z" fill="#EE6055" />
    <!-- 右上象限：草绿 -->
    <path d="M 0.5 -15.5 L 15.5 -15.5 L 15.5 -0.5 L 0.5 -0.5 Z" fill="#70C14C" />
    <!-- 左下象限：天蓝 -->
    <path d="M -15.5 0.5 L -0.5 0.5 L -0.5 15.5 L -15.5 15.5 Z" fill="#4E92DF" />
    <!-- 右下象限：暖黄 -->
    <path d="M 0.5 0.5 L 15.5 0.5 L 15.5 15.5 L 0.5 15.5 Z" fill="#F7D25A" />

    <!-- Git 经典分支线条与三个提交节点（纯深色版本控制图谱，移除原先多余的黑色小窗口） -->
    <g stroke="#1F2328" stroke-linecap="round" stroke-linejoin="round">
      <!-- 主干竖线 -->
      <line x1="-5" y1="8" x2="-5" y2="-8" stroke-width="2.6" />
      <!-- 分叉弧线 -->
      <path d="M -5 1 C -5 -3, 0 -3, 6.5 -3" fill="none" stroke-width="2.6" />

      <!-- 节点 1：主干下部节点 -->
      <circle cx="-5" cy="8" r="3.2" fill="#1F2328" stroke="none" />
      <circle cx="-5" cy="8" r="1.3" fill="#ffffff" stroke="none" />

      <!-- 节点 2：主干上部节点 -->
      <circle cx="-5" cy="-8" r="3.2" fill="#1F2328" stroke="none" />
      <circle cx="-5" cy="-8" r="1.3" fill="#ffffff" stroke="none" />

      <!-- 节点 3：分叉右侧节点 -->
      <circle cx="6.5" cy="-3" r="3.2" fill="#1F2328" stroke="none" />
      <circle cx="6.5" cy="-3" r="1.3" fill="#ffffff" stroke="none" />
    </g>
  </g>
</svg>
