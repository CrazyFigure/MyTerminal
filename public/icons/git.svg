<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="git-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 整体居中并微缩旋转形成 Git Bash 4色菱形 -->
  <g transform="translate(24, 24) rotate(45) translate(-18, -18)" filter="url(#git-shadow)">
    <!-- 基础菱形四等分色块 (36x36 区域，中心 18, 18) -->
    <!-- 左上: 红色 -->
    <path d="M 4 4 Q 4 4 17 4 L 17 17 L 4 17 Q 4 4 4 4 Z" fill="#F05032" rx="4"/>
    <!-- 右上: 深灰黑色 -->
    <path d="M 19 4 L 32 4 Q 32 4 32 17 L 19 17 Z" fill="#2F363D" />
    <!-- 左下: 亮黄色 -->
    <path d="M 4 19 L 17 19 L 17 32 L 4 32 Z" fill="#F3A83B" />
    <!-- 右下: 蓝色 -->
    <path d="M 19 19 L 32 19 L 32 32 L 19 32 Z" fill="#2E76CF" />

    <!-- 外围圆角修饰 -->
    <rect x="3" y="3" width="30" height="30" rx="5.5" fill="none" stroke="#1b1f23" stroke-width="1.2" stroke-opacity="0.25"/>
  </g>

  <!-- 中心终端黑色小窗口 (不随 45 度旋转，保持水平正面朝上，标准 Git Bash 识别特征) -->
  <g transform="translate(24, 24)">
    <rect x="-9" y="-7.5" width="18" height="15" rx="2.5" fill="#181d24" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.9" />
    <!-- 内部白色微型终端提示符 >_ -->
    <path d="M -5 -3 L -2 0 L -5 3" fill="none" stroke="#22c55e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="0" y1="3" x2="4" y2="3" stroke="#f8fafc" stroke-width="1.4" stroke-linecap="round" />
  </g>
</svg>
