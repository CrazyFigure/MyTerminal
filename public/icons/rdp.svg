<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <linearGradient id="rdp-win-blue" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0ea5e9"/>
      <stop offset="0.4" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#0052cc"/>
    </linearGradient>
  </defs>
  <!-- 方案C微章底座：纯正微软 Windows 湛蓝渐变 -->
  <rect x="2" y="2" width="20" height="20" rx="4.5" fill="url(#rdp-win-blue)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
  <!-- 图标内部方正现代电脑屏幕（无老式支架） -->
  <rect x="4.5" y="4.5" width="15" height="12" rx="1.5" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="1.3"/>
  <!-- 屏幕内远程控制交互箭头 -->
  <path d="M8.5 10.5H15.5M15.5 10.5L13 8M15.5 10.5L13 13" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 现代方正一体屏微边线 -->
  <line x1="9" y1="18.5" x2="15" y2="18.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
