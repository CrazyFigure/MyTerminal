[package]
name = "myterminal"
# Rust crate 版本由 scripts/sync-version.mjs 从根 package.json 同步，保持后端 env!("CARGO_PKG_VERSION") 和发布版本一致。
version = "0.7.9"
description = "A modern Rust + Tauri 2 remote terminal manager inspired by FinalShell"
authors = ["OpenAI"]
edition = "2021"
# 项目同时包含桌面主程序和 myterminal-cli；Tauri dev 默认 cargo run 时必须明确主程序。
default-run = "myterminal"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Ctrl+C 信号处理：在开发态终端按 Ctrl+C 时触发正常窗口关闭流程，避免 WebView 检测到后端断连而弹出错误框。
ctrlc = "3"
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
libc = "0.2"
rand = "0.8"
portable-pty = "0.9"
notify-rust = "4.18"
# blocking 供内置 Agent 的 SSE 流式读取使用：工具循环本身跑在独立线程里，
# 用阻塞客户端逐行读流比引入 async 运行时更贴合现有线程模型。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy", "gzip", "blocking", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Windows 必须显式启用 OpenSSL 后端；仅启用 vendored-openssl 仍会让 libssh2 选用 WinCNG，
# 导致常见 OpenSSH/RSA 私钥在签名阶段返回无有效上下文的 Session(-1) unknown error。
ssh2 = { version = "0.9", features = ["vendored-openssl", "openssl-on-win32"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.0"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
# 单实例守卫：只允许同一副本运行一个进程，第二次双击图标时聚焦已有窗口而非再开一个。
# target_os 限定桌面平台，与官方示例一致，避免移动端目标编译该插件。
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
thiserror = "1"
urlencoding = "2"
uuid = { version = "1", features = ["serde", "v4"] }
# 字体资源包使用标准 ZIP 分发；仅启用 Deflate 解压，避免把无关压缩算法带入主程序。
zip = { version = "8.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Windows 原生层关闭 WebView2 的浏览器专用加速键，防止刷新、打印、缩放和开发者工具等行为绕过前端组件。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# RDP 启动前直接写入当前登录会话的 Windows 凭据，避免通过命令行参数暴露密码。
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
windows-core = "0.61"
